<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Eight More Visualizers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: a header with the demo-music switch, then the three styles as cards, each a live 4:3 "top screen".
   One dark look on purpose (the handheld's own theme.h colours), like the player itself. */
:root {
	--bg: #0b0a0d;        /* TOP_CARD */
	--surface: #121116;   /* SURFACE */
	--button: #26242e;    /* BUTTON */
	--rule: #2a2833;      /* RULE */
	--accent: #ffd23f;    /* ACCENT */
	--text: #e8e2d3;      /* TEXT */
	--dim: #8f8a80;       /* DIM */
	--f-pix: "Pixelify Sans", ui-monospace, monospace;
	--f-ui: "Inter", system-ui, sans-serif;
	color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-ui); line-height: 1.5;
	padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 56px; }
main { max-width: 1120px; margin: 0 auto; display: grid; gap: 24px; }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
h1 { font-family: var(--f-pix); font-weight: 600; font-size: 2rem; margin: 0; color: var(--accent); text-wrap: balance; }
.lede { margin: 6px 0 0; color: var(--dim); max-width: 62ch; }
button { font: 600 .95rem var(--f-ui); color: #000; background: var(--accent); border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--button); color: var(--text); }
button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; display: grid; min-width: 0; }
canvas { width: 100%; aspect-ratio: 4 / 3; display: block; background: #000; max-width: 100%; }
.about { padding: 14px 16px 16px; display: grid; gap: 4px; }
.about h2 { margin: 0; font: 600 1.1rem var(--f-pix); color: var(--text); }
.about p { margin: 0; color: var(--dim); font-size: .92rem; }
.cost { font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); font-family: var(--f-pix); }
@media (prefers-reduced-motion: reduce) { .note-motion { display: block; } }
</style>

<main>
	<header>
		<div>
			<h1>Eight more visualizer styles</h1>
			<p class="lede">How each would look on the top screen, moving to made-up music; press the button to drive them with a little synth tune instead. The bars here use the stronger contrast too.</p>
		</div>
		<button id="music" type="button" aria-pressed="false">▶ Play demo music</button>
	</header>
	<div class="grid" id="grid"></div>
</main>

<script>
(() => {
	const STYLES = [
		{ id: 'fire', name: 'Campfire', about: 'A pixel campfire on its logs: each flame is a band and leaps with it, white-hot at the core, red at the tips; the hiss of the treble throws sparks up into the night.', cost: 'Cheap · a still noise, scrolled' },
		{ id: 'dancer', name: 'Banana dancer', about: 'A pixel banana on a disco floor: it squashes and jumps on the bass, waves its arms with the mids, and the treble twinkles stars around it. Each floor tile is a band.', cost: 'Cheap · a few poses in one still' },
		{ id: 'aurora', name: 'Aurora', about: 'Northern lights over a snowy ridge: green and violet curtains that ripple slowly, each stretch of sky as bright and tall as its band, the stars showing through.', cost: 'Cheap · a still curtain, drifting' },
		{ id: 'vinyl', name: 'Turntable', about: 'A record spins under the needle: its grooves glow in rings, bass at the label, treble at the edge, and the label pulses on the beat.', cost: 'Cheap · one ring table, like Circle' },
		{ id: 'garden', name: 'Sound garden', about: 'A row of pixel flowers: each stem grows with its band and opens into a bloom at the top, petals bright when it peaks. Bees drift by on the treble.', cost: 'Cheap · a still of stems and blooms' },
		{ id: 'fireflies', name: 'Firefly jar', about: 'A glass jar in a summer night: each firefly belongs to a band and glows when it plays, so busy music fills the jar with light.', cost: 'Cheap · a still of fireflies, each its band' },
		{ id: 'ocean', name: 'Pixel sea', about: 'Waves roll under a moon: the swell rises with the bass, the chop with the mids, foam sparkles on the treble, and a little boat rides it all.', cost: 'Cheap · a still wave, scrolled' },
		{ id: 'kaleido', name: 'Kaleidoscope', about: 'The spectrum folded into an eight-way mandala: bass in the middle, treble at the rim, its colours slowly turning, each beat leaving a fading ring.', cost: 'Cheap · one lookup table, like Circle' },
	];
	const grid = document.getElementById('grid');
	const ctx = {};
	for (const s of STYLES) {
		const card = document.createElement('section');
		card.className = 'card';
		card.innerHTML = `<canvas width="640" height="480" aria-label="${s.name}, animated preview"></canvas>
			<div class="about"><span class="cost">${s.cost}</span><h2>${s.name}</h2><p>${s.about}</p></div>`;
		grid.appendChild(card);
		ctx[s.id] = card.querySelector('canvas').getContext('2d');
	}
	/* ---------- the "music": made-up by default, or a real synth through an analyser ---------- */
	const BANDS = 16;
	let audio = null, analyser = null, freq = null, wave = null, playing = false;
	const fake = t => {
		const beat = (t * 2) % 1, kick = Math.exp(-beat * 7), hat = Math.exp(-((t * 8) % 1) * 18);
		const b = [];
		for (let i = 0; i < BANDS; i++) {
			const low = Math.max(0, 1 - i / 5), high = Math.max(0, (i - 9) / 7);
			const mid = 0.45 + 0.25 * Math.sin(t * 1.7 + i * 0.7) * Math.sin(t * 0.6 + i);
			b.push(Math.min(1, low * (0.35 + 0.65 * kick) + (1 - low - high) * mid * 0.8 + high * (0.15 + 0.5 * hat) + 0.04 * Math.random()));
		}
		const w = [];
		for (let i = 0; i < 256; i++) {
			const x = i / 256;
			w.push((0.55 * kick + 0.2) * Math.sin(2 * Math.PI * (x * 3 + t * 0.3)) + 0.25 * Math.sin(2 * Math.PI * (x * 11 + t)) * (0.4 + 0.6 * hat) + 0.08 * Math.sin(2 * Math.PI * x * 37));
		}
		return { bands: b, wave: w, kick };
	};
	function real() {
		analyser.getByteFrequencyData(freq);
		analyser.getFloatTimeDomainData(wave);
		const b = [];
		const n = freq.length;
		for (let i = 0; i < BANDS; i++) {
			const a = Math.floor(Math.pow(n, i / BANDS)), z = Math.max(a + 1, Math.floor(Math.pow(n, (i + 1) / BANDS)));
			let m = 0;
			for (let k = a; k < z && k < n; k++) m = Math.max(m, freq[k]);
			b.push(m / 255);
		}
		const w = [];
		const step = Math.floor(wave.length / 256);
		for (let i = 0; i < 256; i++) w.push(wave[i * step] * 2.2);
		return { bands: b, wave: w, kick: b[0] * b[1] };
	}
	function startSynth() {
		audio = new (window.AudioContext || window.webkitAudioContext)();
		analyser = audio.createAnalyser();
		analyser.fftSize = 2048;
		analyser.smoothingTimeConstant = 0.55;
		freq = new Uint8Array(analyser.frequencyBinCount);
		wave = new Float32Array(analyser.fftSize);
		const out = audio.createGain();
		out.gain.value = 0.35;
		out.connect(analyser);
		analyser.connect(audio.destination);
		const noise = audio.createBuffer(1, audio.sampleRate * 0.2, audio.sampleRate);
		const nd = noise.getChannelData(0);
		for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
		const bass = [41.2, 41.2, 55, 49], chords = [[220, 261.6, 329.6], [196, 246.9, 293.7], [174.6, 220, 261.6], [196, 246.9, 293.7]];
		let next = audio.currentTime + 0.05, step = 0;
		const beat = 0.25;	// 120 bpm, eighths
		function tick() {
			if (!playing) return;
			while (next < audio.currentTime + 0.2) {
				const bar = Math.floor(step / 8) % 4, pos = step % 8;
				if (pos % 2 === 0) {	// kick on the beat
					const o = audio.createOscillator(), g = audio.createGain();
					o.frequency.setValueAtTime(140, next); o.frequency.exponentialRampToValueAtTime(40, next + 0.12);
					g.gain.setValueAtTime(1, next); g.gain.exponentialRampToValueAtTime(0.001, next + 0.25);
					o.connect(g).connect(out); o.start(next); o.stop(next + 0.26);
				}
				{	// hats on every eighth
					const s = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
					s.buffer = noise; f.type = 'highpass'; f.frequency.value = 7000;
					g.gain.setValueAtTime(pos % 2 ? 0.35 : 0.18, next); g.gain.exponentialRampToValueAtTime(0.001, next + 0.05);
					s.connect(f).connect(g).connect(out); s.start(next); s.stop(next + 0.06);
				}
				{	// bass, a saw
					const o = audio.createOscillator(), g = audio.createGain();
					o.type = 'sawtooth'; o.frequency.value = bass[bar] * (pos === 3 || pos === 7 ? 2 : 1);
					g.gain.setValueAtTime(0.25, next); g.gain.exponentialRampToValueAtTime(0.001, next + beat * 0.9);
					o.connect(g).connect(out); o.start(next); o.stop(next + beat);
				}
				if (pos === 0)	// a chord a bar
					for (const fq of chords[bar]) {
						const o = audio.createOscillator(), g = audio.createGain();
						o.type = 'triangle'; o.frequency.value = fq;
						g.gain.setValueAtTime(0.0001, next); g.gain.linearRampToValueAtTime(0.09, next + 0.08); g.gain.exponentialRampToValueAtTime(0.001, next + beat * 7.5);
						o.connect(g).connect(out); o.start(next); o.stop(next + beat * 8);
					}
				next += beat; step++;
			}
			setTimeout(tick, 50);
		}
		tick();
	}
	const btn = document.getElementById('music');
	btn.addEventListener('click', () => {
		playing = !playing;
		btn.setAttribute('aria-pressed', String(playing));
		btn.textContent = playing ? '■ Stop demo music' : '▶ Play demo music';
		if (playing) {
			if (!audio) startSynth();
			else { audio.resume(); startSynthLoop(); }
		} else if (audio) audio.suspend();
	});
	function startSynthLoop() { /* the scheduler restarts on resume */ const a = audio; audio = null; a.close(); startSynth(); }

	/* ---------- shared state: falling caps ---------- */
	const caps = {};
	const fall = (key, v, dt, speed = 0.45) => { const c = caps[key] || 0; const n = Math.max(v, c - speed * dt); caps[key] = n; return n; };


	/* the stronger contrast, as the player would apply it: each band pushed away from its neighbours */
	function contrast(b) {
		return b.map((v, i) => {
			const y = (b[Math.max(0, i - 1)] + v + b[Math.min(b.length - 1, i + 1)]) / 3;
			return Math.max(0, Math.min(1, 0.67 + 1.3 * (v - 0.67) + 3 * (v - y)));
		});
	}
	const eased = {};
	const ease = (key, v, dt) => { const c = eased[key] || 0; const n = Math.max(v, c - dt / 0.15); eased[key] = n; return n; };
	// a fixed pseudo-random noise field, like a still the graph would read
	const NOISE = (() => { let seed = 7; const a = new Float32Array(80 * 120); for (let i = 0; i < a.length; i++) { seed = (seed * 16807) % 2147483647; a[i] = seed / 2147483647; } return a; })();
	const noise = (x, y) => NOISE[((y % 120 + 120) % 120) * 80 + ((x % 80) + 80) % 80];
	const title = (g, ink, y = 46) => { g.textAlign = 'center'; g.fillStyle = ink; g.font = '600 28px Inter, sans-serif'; g.fillText('Midnight Arcade', 320, y); };
	let T = 0;

	/* ---------- Campfire: 80x60 pixels of 8 ---------- */
	const FIRE = ['#1a0505', '#5c0d06', '#a8200a', '#e04a10', '#f78a1d', '#ffc23a', '#fff1a8'];
	function fire(g, d, dt) {
		const P = 8, N = 16;
		g.fillStyle = '#07060c'; g.fillRect(0, 0, 640, 480);
		// stars
		for (let i = 0; i < 40; i++) { const x = Math.floor(NOISE[i * 7] * 80), y = Math.floor(NOISE[i * 13] * 22) + 7; g.fillStyle = NOISE[i * 3] > 0.5 ? '#3a3550' : '#26233a'; g.fillRect(x * P, y * P, P - 1, P - 1); }
		const lv = contrast(d.bands).map((v, i) => ease('f' + i, v, dt));
		const scroll = Math.floor(T * 24);	// the noise rises 24 pixels a second: the flicker
		const x0 = 16, w = 48, base = 50;
		for (let x = 0; x < w; x++) {
			const band = Math.min(N - 1, Math.floor(x / (w / N)));
			// the flames lean in towards the middle and taper at the sides
			const shape = 1 - Math.pow(Math.abs(x - w / 2 + 0.5) / (w / 2), 2) * 0.55;
			const h = (6 + 36 * lv[band]) * shape;
			for (let y = 0; y < 46; y++) {
				const up = base - y;	// rows above the logs
				const heat = (h - y) / Math.max(1, h) + 0.55 * (noise(x0 + x, up + scroll) - 0.5);
				if (heat <= 0) continue;
				const c = FIRE[Math.min(FIRE.length - 1, Math.floor(heat * 7.5))];
				g.fillStyle = c; g.fillRect((x0 + x) * P, (up - 1) * P, P - 1, P - 1);
			}
		}
		// sparks: the treble throws them up
		const treble = (lv[12] + lv[13] + lv[14] + lv[15]) / 4;
		for (let i = 0; i < 18; i++) {
			if (NOISE[i * 11] > treble * 1.4) continue;
			const life = ((T * 0.7 + NOISE[i * 5]) % 1), x = x0 + 8 + Math.floor(NOISE[i * 17] * 32 + Math.sin(T * 3 + i) * 2), y = Math.floor(base - 20 - life * 30);
			g.fillStyle = life < 0.5 ? '#ffd76a' : '#e0661e'; g.fillRect(x * P, y * P, P - 1, P - 1);
		}
		// the logs
		const LOG = '#4a2a14', BARK = '#2c170b';
		for (let x = 12; x < 68; x++) for (let y = 50; y < 55; y++) { if ((x + y) % 23 === 0 || y === 54) { g.fillStyle = BARK; } else g.fillStyle = (y === 50 || (x - 12) % 9 === 0) ? BARK : LOG; if (y < 52 || (x > 14 && x < 66)) g.fillRect(x * P, y * P, P - 1, P - 1); }
		for (let x = 10; x < 70; x++) { g.fillStyle = '#16100c'; g.fillRect(x * P, 55 * P, P - 1, P - 1); }
		title(g, '#ffcf7a');
	}

	/* ---------- Banana dancer: 80x60 pixels of 8 ---------- */
	function dancer(g, d, dt) {
		const P = 8, N = 16;
		g.fillStyle = '#120a22'; g.fillRect(0, 0, 640, 480);
		const lv = contrast(d.bands).map((v, i) => ease('d' + i, v, dt));
		const bass = (lv[0] + lv[1] + lv[2]) / 3, midL = (lv[5] + lv[6]) / 2, midR = (lv[8] + lv[9]) / 2, treble = (lv[12] + lv[13] + lv[14] + lv[15]) / 4;
		// the disco floor: 16 tiles in 2 rows, each its band's colour, lit by it
		const HUES = [330, 300, 270, 240, 210, 190, 170, 140, 110, 80, 60, 45, 30, 15, 0, 350];
		for (let i = 0; i < N; i++) for (let r = 0; r < 2; r++) {
			const on = lv[i] > 0.5 - r * 0.15;
			g.fillStyle = `hsl(${HUES[i]} ${on ? 85 : 35}% ${on ? 58 : 18}%)`;
			const tx = 2 + i * 4 + (r ? 2 : 0) % 4;
			g.fillRect(tx * P + 1, (52 + r * 3) * P, 4 * P - 3, 3 * P - 2);
		}
		// the pose: 4 steps of the bass (squashed .. jumping), as a few poses in one still would be
		const step = Math.min(3, Math.floor(bass * 4));
		const bodyH = [21, 25, 28, 28][step], lift = [0, 0, 1, 5][step], squash = [4, 2, 0, 0][step];
		const cx = 41, feet = 49 - lift - (lift ? 1 : 0), top = feet - bodyH;
		const px = (x, y, c) => { g.fillStyle = c; g.fillRect(x * P, y * P, P - 1, P - 1); };
		// shadow
		for (let x = cx - 6 + (lift >> 1); x <= cx + 6 - (lift >> 1); x++) px(x, 51, '#0a0614');
		// body: a curved banana, wider when squashed
		for (let y = top; y < feet; y++) {
			const k = (y - top) / bodyH, bend = Math.round(Math.sin(k * Math.PI) * 3);
			const half = Math.round((k < 0.1 ? 1 : k > 0.9 ? 3 : 5) + squash * Math.sin(k * Math.PI));
			for (let x = -half; x <= half; x++) px(cx - bend + x, y, x === -half ? '#c99a12' : x === half ? '#fff08a' : '#ffd23f');
		}
		px(cx, top - 1, '#5a3d12'); px(cx + 1, top - 2, '#5a3d12');	// the stem
		// face: eyes and a grin that opens on the bass
		const fy = top + Math.round(bodyH * 0.35);
		px(cx - 4, fy, '#1b1206'); px(cx - 4, fy + 1, '#1b1206'); px(cx, fy, '#1b1206'); px(cx, fy + 1, '#1b1206');
		px(cx - 4, fy + 3, '#1b1206'); for (let x = -3; x <= -1; x++) px(cx + x, fy + 4 + (bass > 0.6 ? 1 : 0), '#1b1206'); px(cx, fy + 3, '#1b1206');
		// arms: the left one with the low mids, the right with the high mids (3 angles each)
		const arm = (side, v) => {
			const a = v > 0.66 ? 2 : v > 0.38 ? 1 : 0, sy = top + Math.round(bodyH * 0.5), sx = cx + side * 5 - 2;
			for (let i = 1; i <= 8; i++) px(sx + side * i, sy - (a === 2 ? i : a === 1 ? Math.floor(i / 2) : -Math.floor(i / 2)), '#1b1206');
			const hy = sy - (a === 2 ? 8 : a === 1 ? 4 : -4), hx = sx + side * 9;
			px(hx, hy, '#ffffff'); px(hx, hy - 1, '#ffffff'); px(hx + side, hy, '#ffffff'); px(hx + side, hy - 1, '#ffffff');	// a white glove
		};
		arm(-1, midL); arm(1, midR);
		// legs, bent when squashed
		const legs = lift ? 3 : 2;
		for (let i = 0; i < legs; i++) { px(cx - 4, feet + i, '#1b1206'); px(cx + 1 - (squash > 1 ? 1 : 0), feet + i, '#1b1206'); }
		for (const fx of [cx - 6, cx - 5, cx + 1, cx + 2]) px(fx, feet + legs - 1, '#e8463c');
		// the treble's stars round it: each fixed spot twinkles when the treble is past its own threshold
		const SPOTS = [[18, 14], [62, 12], [14, 30], [66, 28], [24, 6], [56, 22], [10, 18], [70, 40], [30, 20], [52, 6]];
		SPOTS.forEach(([x, y], i) => {
			if (treble < 0.25 + i * 0.06) return;
			const big = ((Math.floor(T * 8) + i) % 3) === 0;
			px(x, y, '#fff6c8');
			if (big) { px(x - 1, y, '#ffd23f'); px(x + 1, y, '#ffd23f'); px(x, y - 1, '#ffd23f'); px(x, y + 1, '#ffd23f'); }
		});
		title(g, '#ffd23f');
	}

	/* ---------- Kaleidoscope: drawn at 320x240, doubled ---------- */
	const KC = document.createElement('canvas'); KC.width = 320; KC.height = 240;
	const kg = KC.getContext('2d');
	const kimg = kg.createImageData(320, 240);
	const KMAP = (() => {	// each pixel's band (by angle, folded eight ways) and radius: the still the graph would read
		const m = new Float32Array(320 * 240 * 2);
		for (let y = 0; y < 240; y++) for (let x = 0; x < 320; x++) {
			const dx = x - 160, dy = y - 132;
			let a = Math.atan2(dy, dx) / (Math.PI / 4);	// in eighths
			a = Math.abs(((a % 2) + 2) % 2 - 1);	// folded: 0..1 across each eighth, mirrored
			const r = Math.hypot(dx, dy) / 120;
			m[(y * 320 + x) * 2] = a; m[(y * 320 + x) * 2 + 1] = r;
		}
		return m;
	})();
	let trail = new Float32Array(320 * 240);
	function hsl(h, s, l) { const a = s * Math.min(l, 1 - l), f = n => { const k = (n + h / 30) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); }; return [f(0) * 255, f(8) * 255, f(4) * 255]; }
	function kaleido(g, d, dt) {
		const lv = contrast(d.bands).map((v, i) => ease('k' + i, v, dt));
		const hue = (T * 25) % 360, data = kimg.data;
		for (let i = 0; i < 320 * 240; i++) {
			const a = KMAP[i * 2], r = KMAP[i * 2 + 1];
			// radius is the frequency (bass in the middle), the fold's angle the level's reach
			const band = Math.min(15, Math.floor(r * 16));
			const v = r < 1 ? lv[band] : 0;
			const lit = v > a * 0.9 + 0.08 ? 1 : 0;
			trail[i] = Math.max(lit, trail[i] * 0.86);
			const t = trail[i];
			if (t < 0.04) { data[i * 4] = 8; data[i * 4 + 1] = 6; data[i * 4 + 2] = 18; data[i * 4 + 3] = 255; continue; }
			const [cr, cg, cb] = hsl((hue + r * 220) % 360, 0.9, 0.12 + 0.5 * t);
			data[i * 4] = cr; data[i * 4 + 1] = cg; data[i * 4 + 2] = cb; data[i * 4 + 3] = 255;
		}
		kg.putImageData(kimg, 0, 0);
		g.imageSmoothingEnabled = false;
		g.drawImage(KC, 0, 0, 640, 480);
		title(g, '#ffffff');
	}


	/* ---------- Aurora: drawn at 160x120, x4 ---------- */
	const AC = document.createElement('canvas'); AC.width = 160; AC.height = 120;
	const ag = AC.getContext('2d'), aimg = ag.createImageData(160, 120);
	function aurora(g, d, dt) {
		const lv = contrast(d.bands).map((v, i) => ease('a' + i, v, dt)), data = aimg.data;
		for (let y = 0; y < 120; y++) for (let x = 0; x < 160; x++) {
			const i = (y * 160 + x) * 4;
			let r = 4, gg = 8, b = 22;
			if (NOISE[(y * 37 + x * 11) % NOISE.length] > 0.992 && y < 90) { r = gg = b = 180; }
			// the curtain: its foot wavers along a slow sine, its height the band's level
			const band = Math.min(15, Math.floor(x / 10));
			const foot = 62 + 6 * Math.sin(x * 0.07 + T * 0.6) + 3 * Math.sin(x * 0.19 - T * 1.1);
			const h = 10 + 50 * lv[band];
			const up = foot - y;
			if (up > 0 && up < h) {
				const k = up / h, streak = 0.6 + 0.4 * Math.sin(x * 0.9 + Math.sin(T + x * 0.05) * 3);
				const glow = (1 - k) * streak * (0.4 + 0.6 * lv[band]);
				r += glow * (40 + 140 * k); gg += glow * (230 - 150 * k); b += glow * (120 + 100 * k);
			}
			// the ridge and its snow
			const ridge = 92 + 7 * Math.sin(x * 0.045 + 1) + 4 * Math.sin(x * 0.13);
			if (y > ridge) { const s = y < ridge + 2; r = s ? 200 : 14; gg = s ? 215 : 20; b = s ? 235 : 34; }
			data[i] = Math.min(255, r); data[i + 1] = Math.min(255, gg); data[i + 2] = Math.min(255, b); data[i + 3] = 255;
		}
		ag.putImageData(aimg, 0, 0); g.imageSmoothingEnabled = false; g.drawImage(AC, 0, 0, 640, 480);
		title(g, '#b9ffd8');
	}

	/* ---------- Turntable ---------- */
	function vinyl(g, d, dt) {
		const lv = contrast(d.bands).map((v, i) => ease('v' + i, v, dt));
		g.fillStyle = '#1a1420'; g.fillRect(0, 0, 640, 480);
		g.fillStyle = '#2a2230'; g.beginPath(); g.roundRect(70, 80, 500, 380, 18); g.fill();
		const cx = 290, cy = 275, R = 175;
		g.fillStyle = '#0c0b0e'; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill();
		// the grooves: 16 rings, bass inside, each lit by its band (one ring table, like Circle)
		for (let i = 0; i < 16; i++) {
			const r = 62 + i * 7, v = lv[i];
			g.strokeStyle = `hsl(${280 - i * 12} 90% ${10 + 55 * v}%)`; g.lineWidth = 4;
			g.beginPath(); g.arc(cx, cy, r, 0, 7); g.stroke();
		}
		// a sheen that turns with the record
		const a = T * 3.5;
		g.strokeStyle = 'rgba(255,255,255,0.10)'; g.lineWidth = 60;
		g.beginPath(); g.arc(cx, cy, 110, a, a + 0.5); g.stroke(); g.beginPath(); g.arc(cx, cy, 110, a + Math.PI, a + Math.PI + 0.5); g.stroke();
		// the label, pulsing on the bass, with a mark that turns
		const pulse = 46 + 8 * lv[0];
		g.fillStyle = '#ffd23f'; g.beginPath(); g.arc(cx, cy, pulse, 0, 7); g.fill();
		g.fillStyle = '#c99a12'; g.beginPath(); g.arc(cx + Math.cos(a) * 26, cy + Math.sin(a) * 26, 7, 0, 7); g.fill();
		g.fillStyle = '#1a1420'; g.beginPath(); g.arc(cx, cy, 5, 0, 7); g.fill();
		// the tonearm
		g.strokeStyle = '#c8c3d0'; g.lineWidth = 8; g.lineCap = 'round';
		g.beginPath(); g.moveTo(520, 130); g.lineTo(505, 300); g.lineTo(430, 370); g.stroke();
		g.fillStyle = '#8f8a99'; g.beginPath(); g.arc(520, 130, 20, 0, 7); g.fill();
		g.fillStyle = '#e8e2d3'; g.fillRect(420, 362, 22, 16);
		title(g, '#ffd23f');
	}

	/* ---------- Sound garden: 80x60 of 8 ---------- */
	const PETALS = ['#ff5a8a', '#ffd23f', '#9b7bff', '#ff8a3d', '#5ad1ff', '#ff5a8a', '#ffd23f', '#9b7bff', '#ff8a3d', '#5ad1ff', '#ff5a8a', '#ffd23f'];
	function garden(g, d, dt) {
		const P = 8, px = (x, y, c) => { g.fillStyle = c; g.fillRect(x * P, y * P, P - 1, P - 1); };
		g.fillStyle = '#0f1a2e'; g.fillRect(0, 0, 640, 480);
		const lv0 = contrast(d.bands), lv = []; for (let i = 0; i < 12; i++) lv.push(ease('g' + i, (lv0[i] + lv0[i + 4 > 15 ? 15 : i + 4]) / 2, dt));
		for (let x = 0; x < 80; x++) for (let y = 52; y < 60; y++) px(x, y, y === 52 ? '#3f8f3a' : (x + y) % 5 ? '#2a5a26' : '#244e20');
		for (let i = 0; i < 12; i++) {
			const x = 6 + i * 6, h = 4 + Math.round(30 * lv[i]), top = 52 - h;
			for (let y = top + 1; y < 52; y++) px(x, y, '#4fb04a');
			if (h > 8) { px(x - 1, 52 - Math.floor(h / 2), '#4fb04a'); px(x - 2, 51 - Math.floor(h / 2), '#4fb04a'); }
			const open = lv[i] > 0.55, c = PETALS[i];
			if (open) { for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1], [0, -2], [-2, 0], [2, 0], [0, 2]]) px(x + dx, top + dy, c); px(x, top, '#ffe9a0'); }
			else { px(x, top, c); px(x, top - 1, c); px(x - 1, top, c); px(x + 1, top, c); }
		}
		const treble = (lv0[13] + lv0[14] + lv0[15]) / 3;
		for (let b = 0; b < 3; b++) if (treble > 0.3 + b * 0.15) {
			const bx = Math.floor(((T * 6 + b * 27) % 90) - 5), by = 14 + b * 6 + Math.round(Math.sin(T * 5 + b) * 2);
			px(bx, by, '#ffd23f'); px(bx + 1, by, '#1b1206'); px(bx + 2, by, '#ffd23f'); px(bx + 1, by - 1, '#e8f4ff');
		}
		title(g, '#ffd8e4');
	}

	/* ---------- Firefly jar ---------- */
	const FLIES = (() => { const a = []; for (let i = 0; i < 48; i++) a.push({ x: 230 + NOISE[i * 19] * 180, y: 160 + NOISE[i * 23] * 230, band: i % 16, ph: NOISE[i * 29] * 6 }); return a; })();
	function fireflies(g, d, dt) {
		const lv = contrast(d.bands).map((v, i) => ease('ff' + i, v, dt));
		g.fillStyle = '#060a14'; g.fillRect(0, 0, 640, 480);
		g.fillStyle = '#0b1a14'; for (let x = 0; x < 640; x += 6) { const h = 20 + 14 * Math.sin(x * 0.11) + 10 * NOISE[x % 80]; g.fillRect(x, 480 - h, 5, h); }
		// the jar
		g.strokeStyle = 'rgba(190,220,255,0.35)'; g.lineWidth = 4; g.beginPath(); g.roundRect(210, 130, 220, 290, 30); g.stroke();
		g.fillStyle = 'rgba(160,200,255,0.05)'; g.fill();
		g.fillStyle = '#6b5640'; g.fillRect(222, 104, 196, 30);
		g.strokeStyle = 'rgba(255,255,255,0.12)'; g.lineWidth = 8; g.beginPath(); g.moveTo(232, 160); g.lineTo(232, 380); g.stroke();
		for (const f of FLIES) {
			const v = lv[f.band], x = f.x + Math.sin(T * 0.8 + f.ph) * 6, y = f.y + Math.cos(T * 0.6 + f.ph) * 5;
			if (v < 0.2) { g.fillStyle = '#1d2a1a'; g.fillRect(x - 2, y - 2, 4, 4); continue; }
			const r = 6 + 16 * v, gr = g.createRadialGradient(x, y, 0, x, y, r);
			gr.addColorStop(0, `rgba(230,255,140,${0.9 * v})`); gr.addColorStop(1, 'rgba(160,255,80,0)');
			g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
			g.fillStyle = '#f4ffc0'; g.fillRect(x - 2, y - 2, 4, 4);
		}
		title(g, '#e6ffb0');
	}

	/* ---------- Pixel sea: 160x120, x4 ---------- */
	function ocean(g, d, dt) {
		const lv = contrast(d.bands).map((v, i) => ease('o' + i, v, dt));
		const bass = (lv[0] + lv[1] + lv[2]) / 3, mid = (lv[5] + lv[6] + lv[7] + lv[8]) / 4, treble = (lv[12] + lv[13] + lv[14] + lv[15]) / 4;
		const S = 4;
		g.fillStyle = '#141a3a'; g.fillRect(0, 0, 640, 480);
		g.fillStyle = '#20285a'; g.fillRect(0, 160, 640, 120);
		g.fillStyle = '#fff3c4'; g.beginPath(); g.arc(470, 120, 34, 0, 7); g.fill();
		g.fillStyle = '#141a3a'; g.beginPath(); g.arc(485, 110, 30, 0, 7); g.fill();
		const surf = x => 300 - (12 + 50 * bass) * (0.5 + 0.5 * Math.sin(x * 0.025 - T * 1.6)) - (4 + 14 * mid) * Math.sin(x * 0.09 + T * 3.1);
		for (let x = 0; x < 640; x += S) {
			const y0 = Math.round(surf(x) / S) * S;
			for (let y = y0; y < 480; y += S) {
				const depth = (y - y0) / 180;
				g.fillStyle = depth < 0.02 ? (treble > 0.35 && NOISE[(x / S + Math.floor(T * 10)) % NOISE.length] > 0.5 ? '#ffffff' : '#9fd8ff') : `rgb(${20 + 30 * (1 - depth)}, ${70 + 70 * (1 - depth)}, ${140 + 60 * (1 - depth)})`;
				g.fillRect(x, y, S, S);
			}
			if ((x / S) % 7 === 0 && NOISE[(x / S + 5) % NOISE.length] > 0.4) { g.fillStyle = 'rgba(255,243,196,0.5)'; g.fillRect(x, y0 + 20 + (x % 30), S * 3, S); }
		}
		// the boat rides the surface
		const bx = 260, by = surf(bx + 30), tilt = (surf(bx + 50) - surf(bx + 10)) / 40;
		g.save(); g.translate(bx + 30, by - 4); g.rotate(Math.atan(tilt));
		g.fillStyle = '#7a3e1c'; g.beginPath(); g.moveTo(-34, -10); g.lineTo(34, -10); g.lineTo(22, 6); g.lineTo(-22, 6); g.fill();
		g.fillStyle = '#d8d2c0'; g.fillRect(-2, -58, 4, 48);
		g.fillStyle = '#ffd23f'; g.beginPath(); g.moveTo(3, -56); g.lineTo(30, -16); g.lineTo(3, -16); g.fill();
		g.restore();
		title(g, '#fff3c4');
	}
	const DRAW = { fire, dancer, kaleido, aurora, vinyl, garden, fireflies, ocean };
	let last = performance.now(), t0 = last;
	function frame(now) {
		const dt = Math.min(0.05, (now - last) / 1000);
		last = now; T = (now - t0) / 1000;
		const d = playing && analyser ? real() : fake(T);
		for (const s of STYLES) DRAW[s.id](ctx[s.id], d, dt);
		requestAnimationFrame(frame);
	}
	const first = fake(0.37);
	T = 0.37;
	for (let k = 0; k < 8; k++) for (const s of STYLES) DRAW[s.id](ctx[s.id], first, 0.016);
	if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(frame);
})();
</script>
